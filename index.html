<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Night Shift MVP</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #060606;
    }
    #app, canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      color: #e8edf8;
    }
    .clock {
      position: absolute;
      top: 16px;
      right: 20px;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 8px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .flashlight {
      position: absolute;
      top: 16px;
      left: 20px;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 8px;
      font-weight: 600;
    }
    .look-indicator {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 14px;
      background: rgba(0, 0, 0, 0.45);
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.25);
      font-size: 13px;
    }
    .directions {
      position: fixed;
      width: min(420px, calc(100vw - 32px));
      left: 16px;
      bottom: 16px;
      background: rgba(8, 8, 10, 0.78);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 10px;
      padding: 12px 14px;
      color: #f5f8ff;
      font-size: 14px;
      line-height: 1.35;
    }
    .directions h2 {
      margin: 0 0 8px;
      font-size: 15px;
    }
    .directions p {
      margin: 4px 0;
    }
    .event-msg {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(20px, 4vw, 34px);
      font-weight: 800;
      letter-spacing: 1px;
      color: #ff5050;
      text-shadow: 0 0 10px rgba(0,0,0,0.9);
      opacity: 0;
      transition: opacity 180ms;
      pointer-events: none;
    }
    .event-msg.visible { opacity: 1; }
  </style>
</head>
<body>
  <div id="app"></div>

  <div class="hud">
    <div id="clock" class="clock">12 AM</div>
    <div id="flashlight" class="flashlight">Flashlight: OFF</div>
    <div id="lookIndicator" class="look-indicator">View: Center</div>
  </div>

  <aside class="directions">
    <h2>Night Shift Directions</h2>
    <p><b>A / D</b> (or <b>← / →</b>) to look Left and Right in the office.</p>
    <p><b>F</b> or hold <b>Space</b> to use the flashlight.</p>
    <p>The animatronic appears around <b>2 AM, 3 AM, 4 AM, and 5 AM</b>. Flash it quickly.</p>
    <p>Survive until <b>6 AM</b>.</p>
  </aside>

  <div id="eventMessage" class="event-msg"></div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
